<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 1 walkthrough</title><link rel="stylesheet" href="style.css"><style>body{padding:16px}h1{font-size:25px;margin:0}#caption{min-height:72px;font-size:18px}iframe{width:100%;height:530px;border:1px solid #b5c8d4;margin-top:12px}progress{width:100%;height:8px}button{padding:7px 13px}@media(max-width:500px){iframe{height:440px}#caption{min-height:125px}}</style></head><body><h1>One configuration, one verified reading</h1><p id="caption" aria-live="polite">Loading an isolated practice run…</p><div class="toolbar"><button id="play">Play animation</button><button id="prev">Previous</button><button id="next">Next step</button><button id="restart">Restart</button><span id="counter">0 / 8</span></div><progress id="progress" max="8" value="0"></progress><iframe id="practice" src="index.html?tour=1" title="Isolated live workbench demonstration"></iframe><p class="small">The outline moves to the real control or result. This practice run does not modify your experiment, autosave or downloads. Use Next step for a slower explanation.</p><script>
const frame=document.getElementById('practice'),captions=[
'1. Prepare A fields: 1.00 m, enabled, CH0, gain ×1, 20 SPS. Suggestions only; the IC has not been configured.',
'2. Read ID. The teaching device returns 0x42.',
'3. Copy encoder to write box. The dropdowns and the byte to be sent are separate.',
'4. Write CONFIG. Sending 0x81 does not alone prove acceptance.',
'5. Read CONFIG. Compare returned 0x81 with the requested byte.',
'6. Advance 3, read each. This includes DATA reads. Inspect settled raw code 2234, no OVERRANGE, and approximately 1.00 m.',
'7. Explain the evidence. This full-workbench demonstration shows an example in Notes; your step-by-step task has a dedicated Save explanation button.',
'8. Save the checkpoint. Your real task stores its own evidence, not this animation. Export from Submit only after completing your independent work.'
];let index=0,ready=false,playing=false,timer=null;
function show(){if(!ready)return;clearTimeout(timer);document.getElementById('caption').textContent=captions[index];document.getElementById('counter').textContent=(index+1)+' / 8';document.getElementById('progress').value=index+1;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===7;frame.contentWindow.postMessage({type:'ee4002-tour-step',index},'*');if(playing&&index<7)timer=setTimeout(()=>{index++;show();},6000);else if(index===7){playing=false;document.getElementById('play').textContent='Play again';}}
document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&index===7)index=0;document.getElementById('play').textContent=playing?'Pause':'Play animation';show();};document.getElementById('next').onclick=()=>{playing=false;document.getElementById('play').textContent='Play animation';index=Math.min(7,index+1);show();};document.getElementById('prev').onclick=()=>{playing=false;document.getElementById('play').textContent='Play animation';index=Math.max(0,index-1);show();};document.getElementById('restart').onclick=()=>{playing=false;index=0;document.getElementById('play').textContent='Play animation';show();};window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='ee4002-tour-ready'){ready=true;show();}});document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;clearTimeout(timer);document.getElementById('play').textContent='Play animation';}});
</script></body></html>
